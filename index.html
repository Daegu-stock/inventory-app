<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#2563eb"
>

<title>부품 재고 관리</title>


<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #f4f5f7;

  color: #1d1d1f;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

}

button,
input {
  font: inherit;
}

.container {

  width: 100%;

  max-width: 480px;

  margin: 0 auto;

  padding: 18px;

}

h1 {

  font-size: 22px;

  margin: 4px 0 6px;

}

.sub {

  color: #666;

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 18px;

}

.card {

  background: #fff;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 1px 5px rgba(0,0,0,.08);

}

label {

  display: block;

  margin-top: 13px;

  font-size: 13px;

  color: #555;

  font-weight: 700;

}

input {

  width: 100%;

  min-height: 48px;

  margin-top: 7px;

  padding: 12px 13px;

  border:
    1px solid #d9d9d9;

  border-radius: 11px;

  background: #fff;

  color: #111;

  outline: none;

}

input:focus {

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}

button {

  width: 100%;

  min-height: 50px;

  margin-top: 11px;

  padding: 12px 14px;

  border: 0;

  border-radius: 11px;

  background: #2563eb;

  color: #fff;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color:
    transparent;

}

button:active {

  transform: scale(.99);

  opacity: .88;

}

button.secondary {

  background: #ececef;

  color: #333;

}

button.manual {

  background: #111827;

}

button.add {

  background: #16a34a;

}

button.save-all {

  background: #2563eb;

  min-height: 56px;

  font-size: 16px;

}

button.danger {

  background: #f3f3f3;

  color: #b42318;

}

button:disabled {

  opacity: .5;

  cursor: default;

}

.top-bar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin: 3px 2px 14px;

}

.welcome {

  font-size: 14px;

  font-weight: 700;

}

.switch-user {

  border: 0;

  background: transparent;

  color: #777;

  font-size: 12px;

  padding: 4px;

  min-height: auto;

  width: auto;

  margin: 0;

  text-decoration: underline;

}

.menu-title {

  font-size: 16px;

  font-weight: 700;

  margin-bottom: 14px;

}

.menu-button {

  min-height: 62px;

  font-size: 16px;

}

#reader {

  width: 100%;

  margin-top: 13px;

  overflow: hidden;

  border-radius: 13px;

  background: #111;

  min-height: 180px;

}

#reader video {

  width: 100% !important;

  height: auto !important;

  display: block;

  border-radius: 13px;

  object-fit: cover;

}

.scan-guide {

  margin-top: 10px;

  padding: 10px 12px;

  border-radius: 10px;

  background: #f5f7fa;

  color: #666;

  font-size: 12px;

  line-height: 1.5;

  text-align: center;

}

.barcode-badge {

  margin-top: 6px;

  padding: 10px 12px;

  background: #f5f5f7;

  border-radius: 9px;

  font-family: monospace;

  font-size: 13px;

  word-break: break-all;

}

.status {

  margin-top: 10px;

  padding: 10px 12px;

  border-radius: 9px;

  font-size: 13px;

  line-height: 1.45;

  display: none;

  white-space: pre-line;

}

.status.info {

  display: block;

  background: #eef5ff;

  color: #175cd3;

}

.status.success {

  display: block;

  background: #ecfdf3;

  color: #027a48;

}

.status.error {

  display: block;

  background: #fef3f2;

  color: #b42318;

}

.hidden {
  display: none !important;
}


/* 출고 목록 */

.list-title {

  font-size: 15px;

  font-weight: 700;

  margin-bottom: 10px;

}

.list-summary {

  background: #f5f7fa;

  padding: 10px 12px;

  border-radius: 10px;

  font-size: 13px;

  margin-bottom: 10px;

  color: #555;

}

.item-row {

  border:
    1px solid #e5e7eb;

  border-radius: 12px;

  padding: 12px;

  margin-top: 9px;

  background: #fff;

}

.item-name {

  font-size: 15px;

  font-weight: 700;

}

.item-info {

  margin-top: 5px;

  font-size: 12px;

  color: #666;

  line-height: 1.5;

}

.item-bottom {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-top: 9px;

}

.item-quantity {

  font-size: 14px;

  font-weight: 700;

}

.remove-btn {

  width: auto;

  min-height: 34px;

  margin: 0;

  padding: 6px 10px;

  background: #fef2f2;

  color: #b42318;

  font-size: 12px;

}

.toast {

  position: fixed;

  left: 50%;

  bottom: 24px;

  transform: translateX(-50%);

  z-index: 1000;

  max-width: calc(100vw - 40px);

  padding: 12px 18px;

  border-radius: 24px;

  background: #111;

  color: #fff;

  font-size: 14px;

  text-align: center;

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s;

}

.toast.show {
  opacity: .95;
}

</style>

</head>


<body>

<div class="container">


<!-- ======================================================
     로그인
     ====================================================== -->

<section id="loginScreen">

<div class="card">

<h1>부품 재고 관리</h1>

<div class="sub">
이름을 입력하면 다음부터 자동으로 로그인됩니다.
</div>

<label for="nameInput">
이름 (사번)
</label>

<input
  id="nameInput"
  autocomplete="name"
  placeholder="예: 김현로"
  onkeydown="if(event.key==='Enter') login();"
>

<button
  id="loginBtn"
  onclick="login()"
>
로그인
</button>

</div>

</section>



<!-- ======================================================
     메인
     ====================================================== -->

<section
  id="mainScreen"
  class="hidden"
>


<div class="top-bar">

<div
  class="welcome"
  id="welcomeText"
></div>

<button
  class="switch-user"
  onclick="logout()"
>
다른 사용자로 전환
</button>

</div>



<!-- ====================================================
     메뉴
     ==================================================== -->

<section id="menuScreen">

<div class="card">

<div class="menu-title">
입력 방법을 선택해주세요
</div>


<button
  class="menu-button"
  onclick="showScanScreen()"
>
📷 바코드 스캔하기
</button>


<button
  class="menu-button manual"
  onclick="showManualScreen()"
>
✏️ 수동으로 입력하기
</button>

</div>

</section>



<!-- ====================================================
     바코드 스캔
     ==================================================== -->

<section
  id="scanScreen"
  class="hidden"
>

<div class="card">

<button
  id="scanBtn"
  onclick="startScan()"
>
📷 바코드 스캔하기
</button>


<div
  id="reader"
  class="hidden"
></div>


<div
  id="scanGuide"
  class="scan-guide hidden"
>
바코드를 화면 가운데 맞춰주세요.<br>
인식되면 부품 정보를 조회합니다.
</div>


<button
  id="stopScanBtn"
  class="secondary hidden"
  onclick="stopScan()"
>
스캔 취소
</button>


<div
  id="cameraStatus"
  class="status"
></div>


<button
  class="secondary"
  onclick="showMenuScreen()"
>
← 입력 방법 선택
</button>

</div>



<!-- 스캔한 부품 입력 -->

<div
  class="card hidden"
  id="scanInputCard"
>

<label>
바코드
</label>

<div
  class="barcode-badge"
  id="barcodeText"
></div>


<label>
Part No
</label>

<input
  id="scanPartNo"
  readonly
>


<label>
부품명
</label>

<input
  id="scanPartName"
  readonly
>


<label>
수량
</label>

<input
  id="scanQuantity"
  type="number"
  inputmode="numeric"
  min="1"
  step="1"
  value="1"
>


<div
  id="scanLookupStatus"
  class="status"
></div>


<button
  class="add"
  id="addScanBtn"
  onclick="addScannedItem()"
>
+ 부품 추가
</button>


<button
  class="secondary"
  onclick="showScanScreen()"
>
📷 다른 부품 스캔
</button>

</div>



<!-- 스캔 출고 목록 -->

<div
  class="card hidden"
  id="scanListCard"
>

<div class="list-title">
📦 출고 예정 목록
</div>

<div
  class="list-summary"
  id="scanListSummary"
>
0개 품목 / 총 0개
</div>

<div id="scanList"></div>


<button
  class="save-all"
  id="scanSaveAllBtn"
  onclick="saveBatch(scanItems)"
>
전체 저장
</button>


<button
  class="danger"
  onclick="clearScanItems()"
>
전체 취소
</button>

</div>

</section>



<!-- ====================================================
     수동 입력
     ==================================================== -->

<section
  id="manualScreen"
  class="hidden"
>

<div class="card">

<div class="menu-title">
수동으로 입력
</div>


<label for="manualPartNo">
Part No
</label>

<input
  id="manualPartNo"
  placeholder="Part No를 입력해주세요"
  autocomplete="off"
  onkeydown="if(event.key==='Enter') lookupManualPart();"
>


<button
  id="findPartBtn"
  onclick="lookupManualPart()"
>
🔍 찾기
</button>


<div
  id="manualLookupStatus"
  class="status"
></div>


<label for="manualPartName">
부품명
</label>

<input
  id="manualPartName"
  placeholder="찾기 버튼을 누르면 자동으로 표시됩니다"
  readonly
>


<label for="manualQuantity">
수량
</label>

<input
  id="manualQuantity"
  type="number"
  inputmode="numeric"
  min="1"
  step="1"
  value="1"
>


<button
  class="add"
  id="manualAddBtn"
  onclick="addManualItem()"
>
+ 부품 추가
</button>


<button
  class="secondary"
  onclick="showMenuScreen()"
>
← 입력 방법 선택
</button>

</div>



<!-- 수동 출고 목록 -->

<div
  class="card hidden"
  id="manualListCard"
>

<div class="list-title">
📦 출고 예정 목록
</div>

<div
  class="list-summary"
  id="manualListSummary"
>
0개 품목 / 총 0개
</div>

<div id="manualList"></div>


<button
  class="save-all"
  id="manualSaveAllBtn"
  onclick="saveBatch(manualItems)"
>
전체 저장
</button>


<button
  class="danger"
  onclick="clearManualItems()"
>
전체 취소
</button>

</div>

</section>

</section>

</div>


<div
  id="toast"
  class="toast"
></div>



<script>


// ============================================================
// 1. 설정
// ============================================================

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbx9LCuPz6c07KDJWNnv7xwl-VQIjj4tV_p62K6dF-SNYj5KWR-glgdfO4gP6IP32-Y6/exec';

const API_TOKEN = '';

const STORAGE_KEY =
  'inventoryEmployeeName';


let html5QrCode = null;

let isScanning = false;

let currentBarcode = '';

let jsonpCounter = 0;


// ------------------------------------------------------------
// 출고 목록
// ------------------------------------------------------------

let scanItems = [];

let manualItems = [];



// ============================================================
// 2. 초기화
// ============================================================

window.addEventListener(
  'load',
  function() {

    const savedName =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (savedName) {

      showMain(
        savedName
      );

    } else {

      document
        .getElementById(
          'nameInput'
        )
        .focus();

    }

  }
);



// ============================================================
// 3. 로그인
// ============================================================

function login() {

  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!name) {

    alert(
      '이름을 입력해주세요.'
    );

    return;

  }


  localStorage.setItem(
    STORAGE_KEY,
    name
  );


  showMain(
    name
  );

}



function logout() {

  stopScan();

  localStorage.removeItem(
    STORAGE_KEY
  );


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'nameInput'
    )
    .value = '';


  scanItems = [];

  manualItems = [];

}



// ============================================================
// 4. 메인 화면
// ============================================================

function showMain(name) {

  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'welcomeText'
    )
    .textContent =
    name +
    '님 안녕하세요';


  showMenuScreen();

}



// ============================================================
// 5. 화면 전환
// ============================================================

function hideAllScreens() {

  document
    .getElementById(
      'menuScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scanScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'manualScreen'
    )
    .classList
    .add('hidden');

}



function showMenuScreen() {

  stopScan();

  hideAllScreens();


  document
    .getElementById(
      'menuScreen'
    )
    .classList
    .remove('hidden');

}



function showScanScreen() {

  hideAllScreens();


  document
    .getElementById(
      'scanScreen'
    )
    .classList
    .remove('hidden');

}



function showManualScreen() {

  stopScan();

  hideAllScreens();


  document
    .getElementById(
      'manualScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'manualPartNo'
    )
    .focus();

}



// ============================================================
// 6. 카메라 시작
// ============================================================

async function startScan() {

  if (isScanning) {
    return;
  }


  clearStatus(
    'cameraStatus'
  );


  document
    .getElementById(
      'scanInputCard'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'reader'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'scanGuide'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'stopScanBtn'
    )
    .classList
    .remove('hidden');


  setCameraStatus(
    'info',
    '카메라를 준비하고 있습니다...'
  );


  try {

    if (

      location.protocol !== 'https:' &&

      location.hostname !== 'localhost' &&

      location.hostname !== '127.0.0.1'

    ) {

      throw new Error(
        '카메라를 사용하려면 HTTPS 주소로 접속해야 합니다.'
      );

    }


    if (

      !navigator.mediaDevices ||

      !navigator.mediaDevices.getUserMedia

    ) {

      throw new Error(
        '현재 브라우저에서 카메라 기능을 사용할 수 없습니다.'
      );

    }


    let permissionStream = null;


    try {

      permissionStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: {
              facingMode: {
                ideal: 'environment'
              }
            },

            audio: false

          });


    } finally {

      if (permissionStream) {

        permissionStream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

      }

    }


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        '사용 가능한 카메라를 찾을 수 없습니다.'
      );

    }


    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ''
            ).toLowerCase();


          return (

            label.includes('back') ||

            label.includes('rear') ||

            label.includes('environment') ||

            label.includes('후면')

          );

        }
      );


    const cameraId =
      backCamera
        ? backCamera.id
        : cameras[0].id;


    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    isScanning = true;


    await html5QrCode.start(

      cameraId,

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const width =
              Math.floor(
                viewfinderWidth * 0.86
              );

            const height =
              Math.floor(
                viewfinderHeight * 0.28
              );


            return {

              width:
                Math.max(
                  220,
                  Math.min(
                    width,
                    360
                  )
                ),

              height:
                Math.max(
                  100,
                  Math.min(
                    height,
                    180
                  )
                )

            };

          },

        aspectRatio:
          1.777778,

        disableFlip:
          false

      },

      function(decodedText) {

        if (!isScanning) {
          return;
        }

        onScanSuccess(
          decodedText
        );

      },

      function() {

        // 스캔 실패는 정상 동작

      }

    );


    setCameraStatus(
      'success',
      '카메라가 실행되었습니다. 바코드를 맞춰주세요.'
    );


  } catch (err) {

    console.error(
      'CAMERA ERROR:',
      err
    );


    isScanning = false;

    cleanupScanner();


    let message =
      '카메라를 시작할 수 없습니다.';


    const errorName =
      err && err.name
        ? err.name
        : '';


    const errorText =
      String(
        err && err.message
          ? err.message
          : err
      );


    if (

      errorName === 'NotAllowedError' ||

      errorText.includes('NotAllowedError')

    ) {

      message =
        '카메라 권한이 차단되어 있습니다.\n' +
        'Chrome의 사이트 권한에서 카메라를 허용해주세요.';

    }

    else if (

      errorName === 'NotFoundError' ||

      errorText.includes('NotFoundError')

    ) {

      message =
        '사용 가능한 카메라를 찾을 수 없습니다.';

    }

    else if (

      errorName === 'NotReadableError' ||

      errorText.includes('NotReadableError')

    ) {

      message =
        '카메라가 다른 앱에서 사용 중일 수 있습니다.\n' +
        '카메라를 사용하는 앱을 종료한 후 다시 시도해주세요.';

    }

    else if (
      errorName === 'SecurityError'
    ) {

      message =
        '브라우저 보안 설정 때문에 카메라에 접근할 수 없습니다.';

    }

    else if (
      errorText.includes('HTTPS')
    ) {

      message =
        '카메라를 사용하려면 HTTPS 주소로 접속해야 합니다.';

    }

    else if (
      errorText &&
      errorText !== 'undefined'
    ) {

      message =
        '카메라 오류: ' +
        errorText;

    }


    setCameraStatus(
      'error',
      message
    );


    showToast(
      message
    );

  }

}



// ============================================================
// 7. 카메라 종료
// ============================================================

async function stopScan() {

  isScanning = false;


  if (html5QrCode) {

    try {

      await html5QrCode.stop();

    } catch (err) {

      console.log(
        '카메라 stop:',
        err
      );

    }


    try {

      html5QrCode.clear();

    } catch (err) {

      console.log(
        'reader clear:',
        err
      );

    }


    html5QrCode = null;

  }


  cleanupScanner();

}



function cleanupScanner() {

  document
    .getElementById(
      'reader'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scanGuide'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'stopScanBtn'
    )
    .classList
    .add('hidden');

}



// ============================================================
// 8. 바코드 스캔 성공
// ============================================================

async function onScanSuccess(
  barcode
) {

  if (!isScanning) {
    return;
  }


  isScanning = false;


  currentBarcode =
    String(
      barcode || ''
    ).trim();


  await stopScan();


  document
    .getElementById(
      'barcodeText'
    )
    .textContent =
    currentBarcode;


  document
    .getElementById(
      'scanQuantity'
    )
    .value = 1;


  document
    .getElementById(
      'scanPartNo'
    )
    .value = '';


  document
    .getElementById(
      'scanPartName'
    )
    .value = '';


  document
    .getElementById(
      'scanInputCard'
    )
    .classList
    .remove('hidden');


  setLookupStatus(
    'scanLookupStatus',
    'info',
    '부품 정보를 조회하고 있습니다...'
  );


  lookupPart(
    currentBarcode
  );

}



// ============================================================
// 9. 바코드 조회
// ============================================================

function lookupPart(
  barcode
) {

  jsonpRequest(

    {

      action:
        'lookup',

      barcode:
        barcode,

      token:
        API_TOKEN

    },


    function(data) {

      if (
        !data ||
        data.success === false
      ) {

        setLookupStatus(
          'scanLookupStatus',
          'error',
          '부품 조회에 실패했습니다.'
        );

        return;

      }


      if (data.found) {

        document
          .getElementById(
            'scanPartName'
          )
          .value =
          data.name || '';


        document
          .getElementById(
            'scanPartNo'
          )
          .value =
          data.partNo || '';


        setLookupStatus(
          'scanLookupStatus',
          'success',
          '등록된 부품을 찾았습니다.'
        );


        document
          .getElementById(
            'scanQuantity'
          )
          .focus();


      } else {

        document
          .getElementById(
            'scanPartName'
          )
          .value = '';


        document
          .getElementById(
            'scanPartNo'
          )
          .value = '';


        setLookupStatus(
          'scanLookupStatus',
          'error',
          '등록되지 않은 바코드입니다.'
        );

      }

    },


    function() {

      setLookupStatus(
        'scanLookupStatus',
        'error',
        '부품명 조회에 실패했습니다. 네트워크를 확인해주세요.'
      );

    }

  );

}

// ============================================================

function addScannedItem() {

  const name =
    document
      .getElementById(
        'scanPartName'
      )
      .value
      .trim();


  const partNo =
    document
      .getElementById(
        'scanPartNo'
      )
      .value
      .trim();

    .getElementById(

// 11. 스캔 목록 표시
// ============================================================

function renderScanList() {

  const card =
    document
      .getElementById(
        'scanListCard'
      );


  const list =
    document
      .getElementById(
        'scanList'
      );


  const summary =
    document
      .getElementById(
        'scanListSummary'
      );


  list.innerHTML = '';


  let total = 0;


  scanItems.forEach(
    function(item, index) {

      total +=

      const row =
        document.createElement(
          'div'
        );


      row.className =

      row.innerHTML =

        '<div class="item-name">' +
        escapeHtml(item.name) +

        '<div class="item-info">' +
        'Part No: ' +
        escapeHtml(item.partNo || '-') +

        '바코드: ' +
        escapeHtml(item.barcode) +
        '</div>' +

        '<div class="item-quantity">' +
        '수량 × ' +
        item.quantity +
        '</div>' +

        '<button class="remove-btn" onclick="removeScanItem(' +
        index +
        ')">' +
        '삭제' +
        '</button>' +

        '</div>';


      list.appendChild(
        row
      );

    }
  );


  summary.textContent =
    scanItems.length +
    '개 품목 / 총 ' +
    total +
    '개';


  if (scanItems.length > 0) {

    card
      .classList
      .remove('hidden');

  } else {

    card
      .classList
      .add('hidden');

  }

}



function removeScanItem(index) {

  scanItems.splice(

}



function clearScanItems() {

  if (

function saveBatch(items) {

  const employee =
    localStorage.getItem(
      STORAGE_KEY
    ) || '';


  if (!employee) {

    alert(
      '로그인 정보가 없습니다.'
    );

    return;

  }


  if (
    !items ||
    items.length === 0
  ) {

    alert(
      '저장할 부품이 없습니다.'
    );

    return;

  }


  const button =
    items === scanItems

      ? document.getElementById(
          'scanSaveAllBtn'
        )

      : document.getElementById(
          'manualSaveAllBtn'
        );


  button.disabled =
    true;


  button.textContent =
    '전체 저장 중...';


  jsonpRequest(

    {

      action:
        'saveBatch',

      employee:
        employee,

      items:
        JSON.stringify(items),

      token:
        API_TOKEN

    },


    function(data) {

      button.disabled =
        false;


      button.textContent =
        '전체 저장';


      if (
        data &&
        data.success
      ) {

        const count =
          data.savedCount || items.length;


        const total =
          data.totalQuantity || 0;


        showToast(
          count +
          '개 품목 / 총 ' +
          total +
          '개 저장 완료 ✓'
        );


        if (items === scanItems) {

          scanItems = [];

          renderScanList();

        } else {

          manualItems = [];

          renderManualList();

          resetManualInputOnly();

        }


      } else {

        const message =
          data &&
          data.message

            ? data.message

            : '저장에 실패했습니다.';


        alert(
          message
        );

      }

    },


    function() {

      button.disabled =
        false;


      button.textContent =
        '전체 저장';


      alert(
        '저장 요청에 실패했습니다. 네트워크를 확인해주세요.'
      );

    }

  );

}

// ============================================================
// 17. JSONP
// ============================================================

function jsonpRequest(
  params,
  onSuccess,
  onError
) {

  const callbackName =
    '__inventory_jsonp_' +
    Date.now() +
    '_' +
    (++jsonpCounter);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =
    setTimeout(
      function() {

        finish();


        if (onError) {

          onError(
            new Error(
              'API timeout'
            )
          );

        }

      },
      15000
    );


  window[callbackName] =
    function(data) {

      finish();


      if (onSuccess) {

        onSuccess(
          data
        );

      }

    };


  const query =
    new URLSearchParams();


  Object.keys(params)
    .forEach(
      function(key) {

        const value =
          params[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  query.set(
    'callback',
    callbackName
  );


  query.set(
    '_',
    String(
      Date.now()
    )
  );


  script.src =
    APPS_SCRIPT_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      finish();


      if (onError) {

        onError(
          new Error(
            'API request failed'
          )
        );

      }

    };


  document
    .body
    .appendChild(
      script
    );


  function finish() {

    if (finished) {
      return;
    }


    finished = true;


    clearTimeout(
      timeout
    );


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }


    if (
      script.parentNode
    ) {

      script
        .parentNode
        .removeChild(
          script
        );

    }

  }

}

// ============================================================
// 19. HTML escape
// ============================================================

function escapeHtml(text) {

  const div =
    document.createElement(
      'div'
    );


  div.textContent =
    String(
      text || ''
    );


  return div.innerHTML;

}



// ============================================================
// 20. Toast
// ============================================================

function showToast(
  message
) {

  const el =
    document
      .getElementById(
        'toast'
      );


  el.textContent =
    message;


  el.classList
    .add('show');


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      function() {

        el.classList
          .remove('show');

      },
      2600
    );

}
