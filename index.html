<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
  name="theme-color"
  content="#2563eb"
>

<title>부품 재고 관리</title>


<script
  src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f4f5f7;

  color: #1d1d1f;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;

}


button,
input {

  font: inherit;

}


.container {

  width: 100%;

  max-width: 480px;

  margin: 0 auto;

  padding: 18px;

}


h1 {

  font-size: 22px;

  margin: 4px 0 6px;

}


.sub {

  color: #666;

  font-size: 13px;

  line-height: 1.5;

  margin-bottom: 18px;

}


.card {

  background: #fff;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 1px 5px rgba(0,0,0,.08);

}


label {

  display: block;

  margin-top: 13px;

  font-size: 13px;

  color: #555;

  font-weight: 700;

}


label:first-child {

  margin-top: 0;

}


input {

  width: 100%;

  min-height: 48px;

  margin-top: 7px;

  padding: 12px 13px;

  border:
    1px solid #d9d9d9;

  border-radius: 11px;

  background: #fff;

  color: #111;

  outline: none;

}


input:focus {

  border-color: #2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}


button {

  width: 100%;

  min-height: 50px;

  margin-top: 11px;

  padding: 12px 14px;

  border: 0;

  border-radius: 11px;

  background: #2563eb;

  color: #fff;

  font-weight: 700;

  cursor: pointer;

}


button:active {

  transform: scale(.99);

  opacity: .88;

}


button.secondary {

  background: #ececef;

  color: #333;

}


button.manual {

  background: #111827;

}


button.admin {

  background: #f3f3f3;

  color: #555;

  border:
    1px solid #ddd;

  margin-top: 28px;

}


button.danger {

  background: #f3f3f3;

  color: #b42318;

}


button:disabled {

  opacity: .5;

  cursor: default;

}


.top-bar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

  margin: 3px 2px 14px;

}


.welcome {

  font-size: 14px;

  font-weight: 700;

}


.switch-user {

  border: 0;

  background: transparent;

  color: #777;

  font-size: 12px;

  padding: 4px;

  min-height: auto;

  width: auto;

  margin: 0;

  text-decoration: underline;

}


.menu-title {

  font-size: 16px;

  font-weight: 700;

  margin-bottom: 14px;

}


.menu-button {

  min-height: 62px;

  font-size: 16px;

}


.admin-divider {

  margin-top: 30px;

  padding-top: 18px;

  border-top:
    1px solid #eee;

  text-align: center;

  color: #999;

  font-size: 11px;

}


#reader {

  width: 100%;

  margin-top: 13px;

  overflow: hidden;

  border-radius: 13px;

  background: #111;

  min-height: 180px;

}


#reader video {

  width: 100% !important;

  height: auto !important;

  display: block;

  border-radius: 13px;

  object-fit: cover;

}


.scan-guide {

  margin-top: 10px;

  padding: 10px 12px;

  border-radius: 10px;

  background: #f5f7fa;

  color: #666;

  font-size: 12px;

  line-height: 1.5;

  text-align: center;

}


.barcode-badge {

  margin-top: 6px;

  padding: 10px 12px;

  background: #f5f5f7;

  border-radius: 9px;

  font-family: monospace;

  font-size: 13px;

  word-break: break-all;

}


.status {

  margin-top: 10px;

  padding: 10px 12px;

  border-radius: 9px;

  font-size: 13px;

  line-height: 1.45;

  display: none;

  white-space: pre-line;

}


.status.info {

  display: block;

  background: #eef5ff;

  color: #175cd3;

}


.status.success {

  display: block;

  background: #ecfdf3;

  color: #027a48;

}


.status.error {

  display: block;

  background: #fef3f2;

  color: #b42318;

}


.hidden {

  display: none !important;

}


.batch-item {

  margin-top: 12px;

  padding: 14px;

  background: #f7f7f8;

  border-radius: 12px;

  border: 1px solid #eee;

}


.batch-item-title {

  font-weight: 700;

  font-size: 14px;

  margin-bottom: 5px;

}


.batch-item-info {

  font-size: 12px;

  color: #666;

  line-height: 1.5;

}


.batch-item-remove {

  margin-top: 8px;

  min-height: 40px;

  background: #fff;

  color: #b42318;

  border: 1px solid #eee;

}


.admin-title {

  font-size: 17px;

  font-weight: 700;

  margin-bottom: 6px;

}


.admin-sub {

  font-size: 12px;

  color: #777;

  line-height: 1.5;

  margin-bottom: 15px;

}


.toast {

  position: fixed;

  left: 50%;

  bottom: 24px;

  transform: translateX(-50%);

  z-index: 1000;

  max-width:
    calc(100vw - 40px);

  padding: 12px 18px;

  border-radius: 24px;

  background: #111;

  color: #fff;

  font-size: 14px;

  text-align: center;

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s;

}


.toast.show {

  opacity: .95;

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================================
     로그인
     ====================================================== -->

<section id="loginScreen">

  <div class="card">

    <h1>
      부품 재고 관리
    </h1>

    <div class="sub">
      이름을 입력하면 다음부터 자동으로 로그인됩니다.
    </div>

    <label>
      이름 (사번)
    </label>

    <input
      id="nameInput"
      autocomplete="name"
      placeholder="예: 김현로"
      onkeydown="
        if(event.key==='Enter') login();
      "
    >

    <button
      id="loginBtn"
      onclick="login()"
    >
      로그인
    </button>

  </div>

</section>



<!-- ======================================================
     메인
     ====================================================== -->

<section
  id="mainScreen"
  class="hidden"
>


<div class="top-bar">

  <div
    class="welcome"
    id="welcomeText"
  ></div>

  <button
    class="switch-user"
    onclick="logout()"
  >
    다른 사용자로 전환
  </button>

</div>



<!-- ====================================================
     메뉴
     ==================================================== -->

<section id="menuScreen">

  <div class="card">

    <div class="menu-title">
      입력 방법을 선택해주세요
    </div>


    <button
      class="menu-button"
      onclick="showScanScreen()"
    >
      📷 바코드 스캔하기
    </button>


    <button
      class="menu-button manual"
      onclick="showManualScreen()"
    >
      ✏️ 수동으로 입력하기
    </button>


    <div class="admin-divider">
      관리자 전용
    </div>


    <button
      class="admin"
      onclick="showAdminLoginScreen()"
    >
      🔐 바코드 등록하기
    </button>

  </div>

</section>



<!-- ====================================================
     바코드 스캔
     ==================================================== -->

<section
  id="scanScreen"
  class="hidden"
>

<div class="card">

  <button
    onclick="startScan('normal')"
  >
    📷 바코드 스캔 시작
  </button>


  <div
    id="reader"
    class="hidden"
  ></div>


  <div
    id="scanGuide"
    class="scan-guide hidden"
  >
    바코드를 화면 가운데 맞춰주세요.<br>
    인식되면 자동으로 다음 단계로 넘어갑니다.
  </div>


  <button
    class="secondary hidden"
    id="stopScanBtn"
    onclick="stopScan()"
  >
    스캔 취소
  </button>


  <div
    id="cameraStatus"
    class="status"
  ></div>


  <button
    class="secondary"
    onclick="showMenuScreen()"
  >
    ← 입력 방법 선택
  </button>

</div>



<div
  class="card hidden"
  id="resultCard"
>

  <label>
    바코드
  </label>

  <div
    class="barcode-badge"
    id="barcodeText"
  ></div>


  <label>
    Part No
  </label>

  <input
    id="partNo"
    placeholder="Part No"
  >


  <label>
    부품명
  </label>

  <input
    id="partName"
    placeholder="부품명"
  >


  <label>
    수량
  </label>

  <input
    id="quantity"
    type="number"
    min="1"
    step="1"
    value="1"
  >


  <div
    id="lookupStatus"
    class="status"
  ></div>


  <button
    id="saveBtn"
    onclick="saveRecord()"
  >
    저장
  </button>


  <button
    class="secondary"
    onclick="resetForm()"
  >
    취소
  </button>

</div>

</section>



<!-- ====================================================
     수동 입력
     ==================================================== -->

<section
  id="manualScreen"
  class="hidden"
>

<div class="card">

  <div class="menu-title">
    수동으로 입력
  </div>


  <label>
    Part No
  </label>

  <input
    id="manualPartNo"
    placeholder="Part No를 입력해주세요"
    autocomplete="off"
    onkeydown="
      if(event.key==='Enter')
      lookupManualPart();
    "
  >


  <button
    id="findPartBtn"
    onclick="lookupManualPart()"
  >
    🔍 찾기
  </button>


  <div
    id="manualLookupStatus"
    class="status"
  ></div>


  <label>
    부품명
  </label>

  <input
    id="manualPartName"
    readonly
    placeholder="찾기 버튼을 누르면 표시됩니다"
  >


  <label>
    수량
  </label>

  <input
    id="manualQuantity"
    type="number"
    min="1"
    step="1"
    value="1"
  >


  <button
    onclick="addManualItem()"
  >
    ➕ 출고 목록에 추가
  </button>


  <div
    id="batchList"
  ></div>


  <button
    id="batchSaveBtn"
    onclick="saveManualBatch()"
    class="hidden"
  >
    📦 전체 저장
  </button>


  <button
    class="secondary"
    onclick="resetManualForm()"
  >
    취소
  </button>


  <button
    class="secondary"
    onclick="showMenuScreen()"
  >
    ← 입력 방법 선택
  </button>

</div>

</section>



<!-- ====================================================
     관리자 로그인
     ==================================================== -->

<section
  id="adminLoginScreen"
  class="hidden"
>

<div class="card">

  <div class="admin-title">
    관리자 인증
  </div>

  <div class="admin-sub">
    바코드 등록은 관리자만 사용할 수 있습니다.
  </div>


  <label>
    관리자 비밀번호
  </label>

  <input
    id="adminPassword"
    type="password"
    inputmode="numeric"
    placeholder="비밀번호 입력"
    onkeydown="
      if(event.key==='Enter')
      adminLogin();
    "
  >


  <button
    onclick="adminLogin()"
  >
    확인
  </button>


  <div
    id="adminLoginStatus"
    class="status"
  ></div>


  <button
    class="secondary"
    onclick="showMenuScreen()"
  >
    ← 돌아가기
  </button>

</div>

</section>



<!-- ====================================================
     관리자 바코드 등록
     ==================================================== -->

<section
  id="adminRegisterScreen"
  class="hidden"
>

<div class="card">

  <div class="admin-title">
    🔐 바코드 등록
  </div>

  <div class="admin-sub">
    바코드를 스캔한 후 해당 부품의 Part No를 입력해주세요.
  </div>


  <button
    onclick="startScan('admin')"
  >
    📷 바코드 스캔하기
  </button>


  <div
    id="adminReader"
    class="hidden"
  ></div>


  <div
    id="adminBarcodeBadge"
    class="barcode-badge hidden"
  ></div>


  <label>
    Part No
  </label>

  <input
    id="adminPartNo"
    placeholder="Part No를 입력해주세요"
    onkeydown="
      if(event.key==='Enter')
      lookupAdminPart();
    "
  >


  <button
    onclick="lookupAdminPart()"
  >
    🔍 Part No 확인
  </button>


  <div
    id="adminLookupStatus"
    class="status"
  ></div>


  <label>
    부품명
  </label>

  <input
    id="adminPartName"
    readonly
    placeholder="Part No 확인 후 표시됩니다"
  >


  <button
    id="adminRegisterBtn"
    onclick="registerBarcode()"
  >
    💾 바코드 등록하기
  </button>


  <button
    class="secondary"
    onclick="resetAdminForm()"
  >
    취소
  </button>


  <button
    class="secondary"
    onclick="showMenuScreen()"
  >
    ← 메인 메뉴
  </button>

</div>

</section>


</section>

</div>



<div
  id="toast"
  class="toast"
></div>



<script>


// ============================================================
// 1. 설정
// ============================================================

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbx9LCuPz6c07KDJWNnv7xwl-VQIjj4tV_p62K6dF-SNYj5KWR-glgdfO4gP6IP32-Y6/exec';


const API_TOKEN = '';

const STORAGE_KEY =
  'inventoryEmployeeName';


let html5QrCode = null;

let isScanning = false;

let scanMode = 'normal';

let currentBarcode = '';

let adminBarcode = '';

let manualItems = [];

let jsonpCounter = 0;



// ============================================================
// 2. 초기화
// ============================================================

window.addEventListener(
  'load',
  function() {

    const savedName =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (savedName) {

      showMain(
        savedName
      );

    } else {

      document
        .getElementById(
          'nameInput'
        )
        .focus();

    }

  }
);



// ============================================================
// 3. 로그인
// ============================================================

function login() {

  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!name) {

    alert(
      '이름을 입력해주세요.'
    );

    return;

  }


  localStorage.setItem(
    STORAGE_KEY,
    name
  );


  showMain(
    name
  );

}



function logout() {

  stopScan();


  localStorage.removeItem(
    STORAGE_KEY
  );


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'nameInput'
    )
    .value = '';


  resetForm();

  resetManualForm();

  resetAdminForm();

}



function showMain(name) {

  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'welcomeText'
    )
    .textContent =
    name +
    '님 안녕하세요';


  showMenuScreen();

}



// ============================================================
// 4. 화면 전환
// ============================================================

function hideAllScreens() {

  const ids = [

    'menuScreen',

    'scanScreen',

    'manualScreen',

    'adminLoginScreen',

    'adminRegisterScreen'

  ];


  ids.forEach(
    function(id) {

      document
        .getElementById(id)
        .classList
        .add('hidden');

    }
  );

}



function showMenuScreen() {

  stopScan();

  hideAllScreens();


  document
    .getElementById(
      'menuScreen'
    )
    .classList
    .remove('hidden');


  resetForm();

  resetManualForm();

}



function showScanScreen() {

  hideAllScreens();


  document
    .getElementById(
      'scanScreen'
    )
    .classList
    .remove('hidden');

}



function showManualScreen() {

  hideAllScreens();


  document
    .getElementById(
      'manualScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'manualPartNo'
    )
    .focus();

}



function showAdminLoginScreen() {

  hideAllScreens();


  document
    .getElementById(
      'adminLoginScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'adminPassword'
    )
    .value = '';


  clearStatus(
    'adminLoginStatus'
  );


  document
    .getElementById(
      'adminPassword'
    )
    .focus();

}



// ============================================================
// 5. 관리자 로그인
// ============================================================

function adminLogin() {

  const password =
    document
      .getElementById(
        'adminPassword'
      )
      .value;


  if (!password) {

    setStatus(
      'adminLoginStatus',
      'error',
      '관리자 비밀번호를 입력해주세요.'
    );

    return;

  }


  setStatus(
    'adminLoginStatus',
    'info',
    '관리자 인증 중...'
  );


  jsonpRequest(

    {

      action:
        'adminLogin',

      password:
        password

    },


    function(data) {

      if (
        data &&
        data.success
      ) {

        showToast(
          '관리자 인증 성공'
        );


        showAdminRegisterScreen();

      } else {

        setStatus(
          'adminLoginStatus',
          'error',
          data &&
          data.message
            ? data.message
            : '비밀번호가 올바르지 않습니다.'
        );

      }

    },


    function() {

      setStatus(
        'adminLoginStatus',
        'error',
        '관리자 인증 요청에 실패했습니다.'
      );

    }

  );

}



function showAdminRegisterScreen() {

  hideAllScreens();

  resetAdminForm();


  document
    .getElementById(
      'adminRegisterScreen'
    )
    .classList
    .remove('hidden');

}



// ============================================================
// 6. 카메라 시작
// ============================================================

async function startScan(mode) {

  if (isScanning) {

    return;

  }


  scanMode =
    mode || 'normal';


  const readerId =
    scanMode === 'admin'
      ? 'adminReader'
      : 'reader';


  const reader =
    document.getElementById(
      readerId
    );


  reader.classList
    .remove('hidden');


  if (scanMode === 'normal') {

    document
      .getElementById(
        'scanGuide'
      )
      .classList
      .remove('hidden');


    document
      .getElementById(
        'stopScanBtn'
      )
      .classList
      .remove('hidden');


    setStatus(
      'cameraStatus',
      'info',
      '카메라를 준비하고 있습니다...'
    );

  }


  try {

    if (

      location.protocol !== 'https:' &&

      location.hostname !== 'localhost' &&

      location.hostname !== '127.0.0.1'

    ) {

      throw new Error(
        '카메라를 사용하려면 HTTPS 주소로 접속해야 합니다.'
      );

    }


    if (

      !navigator.mediaDevices ||

      !navigator.mediaDevices.getUserMedia

    ) {

      throw new Error(
        '현재 브라우저에서 카메라 기능을 사용할 수 없습니다.'
      );

    }


    let permissionStream = null;


    try {

      permissionStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: {
              facingMode: {
                ideal: 'environment'
              }
            },

            audio: false

          });

    } finally {

      if (permissionStream) {

        permissionStream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );

      }

    }


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        '사용 가능한 카메라를 찾을 수 없습니다.'
      );

    }


    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ''
            ).toLowerCase();


          return (

            label.includes('back') ||

            label.includes('rear') ||

            label.includes('environment') ||

            label.includes('후면')

          );

        }
      );


    const cameraId =
      backCamera
        ? backCamera.id
        : cameras[0].id;


    html5QrCode =
      new Html5Qrcode(
        readerId
      );


    isScanning = true;


    if (scanMode === 'normal') {

      setStatus(
        'cameraStatus',
        'info',
        '카메라를 시작하고 있습니다...'
      );

    }


    await html5QrCode.start(

      cameraId,

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            return {

              width:
                Math.max(
                  220,
                  Math.min(
                    Math.floor(width * .86),
                    360
                  )
                ),

              height:
                Math.max(
                  100,
                  Math.min(
                    Math.floor(height * .28),
                    180
                  )
                )

            };

          },

        aspectRatio:
          1.777778,

        disableFlip:
          false

      },


      function(decodedText) {

        if (!isScanning) {

          return;

        }


        onScanSuccess(
          decodedText
        );

      },


      function() {}

    );


    if (scanMode === 'normal') {

      setStatus(
        'cameraStatus',
        'success',
        '카메라가 실행되었습니다. 바코드를 맞춰주세요.'
      );

    }

  } catch (err) {

    console.error(
      'CAMERA ERROR:',
      err
    );


    isScanning = false;

    cleanupScanner();


    let message =
      '카메라를 시작할 수 없습니다.';


    const errorName =
      err &&
      err.name
        ? err.name
        : '';


    const errorText =
      String(
        err &&
        err.message
          ? err.message
          : err
      );


    if (
      errorName === 'NotAllowedError' ||
      errorText.includes('NotAllowedError')
    ) {

      message =
        '카메라 권한이 차단되어 있습니다.\n' +
        'Chrome의 사이트 권한에서 카메라를 허용해주세요.';

    }

    else if (
      errorName === 'NotFoundError'
    ) {

      message =
        '사용 가능한 카메라를 찾을 수 없습니다.';

    }

    else if (
      errorName === 'NotReadableError'
    ) {

      message =
        '카메라가 다른 앱에서 사용 중일 수 있습니다.';

    }

    else {

      message =
        '카메라 오류: ' +
        errorText;

    }


    if (scanMode === 'normal') {

      setStatus(
        'cameraStatus',
        'error',
        message
      );

    } else {

      showToast(
        message
      );

    }

  }

}

async function stopScan() {

  isScanning = false;


  if (html5QrCode) {

    try {

      await html5QrCode.stop();

    } catch (err) {

      console.log(
        'camera stop',
        err
      );

    }


    try {

      html5QrCode.clear();

    } catch (err) {}


    html5QrCode =
      null;

  }


  cleanupScanner();

}



function cleanupScanner() {

  [
    'reader',
    'adminReader'
  ].forEach(
    function(id) {

      const el =
        document.getElementById(id);

      if (el) {

        el.classList
          .add('hidden');

      }

    }
  );


  const guide =
    document.getElementById(
      'scanGuide'
    );

  if (guide) {

    guide.classList
      .add('hidden');

  }


  const stop =
    document.getElementById(
      'stopScanBtn'
    );

  if (그만) {

    stop.classList
      .add('hidden');

  }

}

async function onScanSuccess(
  barcode
) {

  if (!isScanning) {

    return;

  }


  isScanning = false;


  currentBarcode =
    String(
      barcode || ''
    ).trim();


  if (scanMode === 'admin') {

    adminBarcode =
      currentBarcode;


    await stopScan();


    document
      .getElementById(
        'adminBarcodeBadge'
      )
      .textContent =
      currentBarcode;


    document
      .getElementById(
        'adminBarcodeBadge'
      )
      .classList
      .remove('hidden');


    setStatus(
      'adminLookupStatus',
      'success',
      '바코드가 입력되었습니다. Part No를 입력해주세요.'
    );


    document
      .getElementById(
        'adminPartNo'
      )
      .focus();


    return;

  }


  await stopScan();


  document
    .getElementById(
      'barcodeText'
    )
    .textContent =
    currentBarcode;


  document
    .getElementById(
      'quantity'
    )
    .value = 1;


  document
    .getElementById(
      'partNo'
    )
    .value = '';


  document
    .getElementById(
      'partName'
    )
    .value = '';


  document
    .getElementById(
      'resultCard'
    )
    .classList
    .remove('hidden');


  setStatus(
    'lookupStatus',
    'info',
    '부품 정보를 조회하고 있습니다...'
  );


  lookupPart(
    currentBarcode
  );

}

  manualItems.forEach(

        'onclick="removeManualItem(' +
        index +
        ')">' +

        '삭제' +

        '</button>';


      list.appendChild(
        div
      );

  );


  const saveBtn =

    manualItems.length > 0

    saveBtn.classList
      .remove('hidden');

      manualItems.length +

  } else {

// ============================================================
// 21. JSONP
// ============================================================

function jsonpRequest(
  params,
  onSuccess,
  onError
) {

  const callbackName =
    '__inventory_jsonp_' +
    Date.now() +
    '_' +
    (++jsonpCounter);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =
    setTimeout(
      function() {

        finish();

        if (onError) {

          onError(
            new Error(
              'API timeout'
            )
          );

        }

      },
      15000
    );


  window[callbackName] =
    function(data) {

      finish();

      if (onSuccess) {

        onSuccess(
          data
        );

      }

    };


  const query =
    new URLSearchParams();


  Object.keys(params)
    .forEach(
      function(key) {

        const value =
          params[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  query.set(
    'callback',
    callbackName
  );


  query.set(
    '_',
    String(Date.now())
  );


  script.src =
    APPS_SCRIPT_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      finish();

      if (onError) {

        onError(
          new Error(
            'API request failed'
          )
        );

      }

    };


  document.body
    .appendChild(
      script
    );


  function finish() {

    if (finished) {

      return;

    }


    finished = true;


    clearTimeout(
      timeout
    );


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] = undefined;

    }


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }

}



// ============================================================
// 22. 상태 표시
// ============================================================

function setStatus(
  id,
  type,
  message
) {

  const el =
    document.getElementById(
      id
    );


  el.className =
    'status ' +
    type;


  el.textContent =
    message;

}



function clearStatus(
  id
) {

  const el =
    document.getElementById(
      id
    );


  el.className =
    'status';


  el.textContent =
    '';

}



// ============================================================
// 23. Toast
// ============================================================

function showToast(
  message
) {

  const el =
    document.getElementById(
      'toast'
    );


  el.textContent =
    message;


  el.classList
    .add('show');


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      function() {

        el.classList
          .remove('show');

      },
      2600
    );

}



// ============================================================
// 24. HTML escape
// ============================================================

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}
