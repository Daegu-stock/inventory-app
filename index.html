<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>부품 재고 관리</title>


  <!-- 바코드 / QR 스캐너 -->

  <script
    src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f4f5f7;

      color: #1d1d1f;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Malgun Gothic",
        sans-serif;

    }


    button,
    input {

      font: inherit;

    }


    .container {

      width: 100%;

      max-width: 480px;

      margin: 0 auto;

      padding: 18px;

    }


    h1 {

      font-size: 22px;

      margin:
        4px 0 6px;

    }


    .sub {

      color: #666;

      font-size: 13px;

      line-height: 1.5;

      margin-bottom: 18px;

    }


    .card {

      background: #fff;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 14px;

      box-shadow:
        0 1px 5px rgba(0,0,0,.08);

    }


    label {

      display: block;

      margin-top: 13px;

      font-size: 13px;

      color: #555;

      font-weight: 700;

    }


    label:first-child {

      margin-top: 0;

    }


    input {

      width: 100%;

      min-height: 48px;

      margin-top: 7px;

      padding:
        12px 13px;

      border:
        1px solid #d9d9d9;

      border-radius: 11px;

      background: #fff;

      color: #111;

      outline: none;

    }


    input:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);

    }


    button {

      width: 100%;

      min-height: 50px;

      margin-top: 11px;

      padding:
        12px 14px;

      border: 0;

      border-radius: 11px;

      background: #2563eb;

      color: #fff;

      font-weight: 700;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    button:active {

      transform:
        scale(.99);

      opacity: .88;

    }


    button.secondary {

      background: #ececef;

      color: #333;

    }


    button.danger {

      background: #f3f3f3;

      color: #b42318;

    }


    button.admin {

      background: #f3f4f6;

      color: #374151;

      border:
        1px solid #d1d5db;

    }


    button:disabled {

      opacity: .5;

      cursor: default;

    }


    .top-bar {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 12px;

      margin:
        3px 2px 14px;

    }


    .welcome {

      font-size: 14px;

      font-weight: 700;

    }


    .switch-user {

      border: 0;

      background:
        transparent;

      color: #777;

      font-size: 12px;

      padding: 4px;

      min-height: auto;

      width: auto;

      margin: 0;

      text-decoration:
        underline;

    }


    .menu-title {

      font-size: 16px;

      font-weight: 700;

      margin-bottom: 14px;

    }


    .menu-button {

      min-height: 62px;

      font-size: 16px;

    }


    .menu-button.manual {

      background: #111827;

    }


    .admin-area {

      margin-top: 28px;

      padding-top: 20px;

      border-top:
        1px solid #eeeeee;

    }


    .admin-title {

      font-size: 12px;

      color: #888;

      text-align: center;

      margin-bottom: 7px;

    }


    #reader {

      width: 100%;

      margin-top: 13px;

      overflow: hidden;

      border-radius: 13px;

      background: #111;

      min-height: 180px;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 13px;

      object-fit: cover;

    }


    .scan-guide {

      margin-top: 10px;

      padding:
        10px 12px;

      border-radius: 10px;

      background: #f5f7fa;

      color: #666;

      font-size: 12px;

      line-height: 1.5;

      text-align: center;

    }


    .barcode-badge {

      margin-top: 6px;

      padding:
        10px 12px;

      background: #f5f5f7;

      border-radius: 9px;

      font-family: monospace;

      font-size: 13px;

      word-break: break-all;

    }


    .status {

      margin-top: 10px;

      padding:
        10px 12px;

      border-radius: 9px;

      font-size: 13px;

      line-height: 1.45;

      display: none;

      white-space: pre-line;

    }


    .status.info {

      display: block;

      background: #eef5ff;

      color: #175cd3;

    }


    .status.success {

      display: block;

      background: #ecfdf3;

      color: #027a48;

    }


    .status.error {

      display: block;

      background: #fef3f2;

      color: #b42318;

    }


    .hidden {

      display: none !important;

    }


    .toast {

      position: fixed;

      left: 50%;

      bottom: 24px;

      transform:
        translateX(-50%);

      z-index: 1000;

      max-width:
        calc(100vw - 40px);

      padding:
        12px 18px;

      border-radius: 24px;

      background: #111;

      color: #fff;

      font-size: 14px;

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .2s;

    }


    .toast.show {

      opacity: .95;

    }

  </style>

</head>


<body>


<div class="container">


  <!-- ======================================================
       로그인 화면
       ====================================================== -->

  <section
    id="loginScreen"
  >

    <div class="card">

      <h1>
        부품 재고 관리
      </h1>

      <div class="sub">

        이름을 입력하면
        다음부터 자동으로 로그인됩니다.

      </div>


      <label
        for="nameInput"
      >
        이름 (사번)
      </label>


      <input
        id="nameInput"
        autocomplete="name"
        placeholder="예: 김현로"
        onkeydown="
          if(event.key==='Enter')
          login();
        "
      >


      <button
        id="loginBtn"
        onclick="login()"
      >
        로그인
      </button>

    </div>

  </section>



  <!-- ======================================================
       메인 화면
       ====================================================== -->

  <section
    id="mainScreen"
    class="hidden"
  >


    <div class="top-bar">

      <div
        class="welcome"
        id="welcomeText"
      ></div>


      <button
        class="switch-user"
        onclick="logout()"
      >
        다른 사용자로 전환
      </button>

    </div>



    <!-- ====================================================
         메뉴
         ==================================================== -->

    <section
      id="menuScreen"
    >

      <div class="card">

        <div class="menu-title">
          입력 방법을 선택해주세요
        </div>


        <button
          class="menu-button"
          onclick="showScanScreen()"
        >
          📷 바코드 스캔하기
        </button>


        <button
          class="menu-button manual"
          onclick="showManualScreen()"
        >
          ✏️ 수동으로 입력하기
        </button>


        <!-- 관리자 기능 -->

        <div class="admin-area">

          <div class="admin-title">
            관리자 기능
          </div>


          <button
            class="admin"
            onclick="showBarcodeRegisterPassword()"
          >
            🔐 바코드 등록하기
          </button>

        </div>

      </div>

    </section>



    <!-- ====================================================
         바코드 스캔 화면
         ==================================================== -->

    <section
      id="scanScreen"
      class="hidden"
    >

      <div class="card">

        <button
          id="scanBtn"
          onclick="startScan()"
        >
          📷 바코드 스캔하기
        </button>


        <div
          id="reader"
          class="hidden"
        ></div>


        <div
          id="scanGuide"
          class="scan-guide hidden"
        >
          바코드를 화면 가운데 맞춰주세요.<br>
          인식되면 자동으로 다음 단계로 넘어갑니다.
        </div>


        <button
          id="stopScanBtn"
          class="secondary hidden"
          onclick="stopScan()"
        >
          스캔 취소
        </button>


        <div
          id="cameraStatus"
          class="status"
        ></div>


        <button
          class="secondary"
          onclick="showMenuScreen()"
        >
          ← 입력 방법 선택
        </button>

      </div>


      <!-- 스캔 결과 -->

      <div
        class="card hidden"
        id="resultCard"
      >

        <label>
          바코드
        </label>


        <div
          class="barcode-badge"
          id="barcodeText"
        ></div>


        <label
          for="partNo"
        >
          Part No
        </label>


        <input
          id="partNo"
          placeholder="Part No"
        >


        <label
          for="partName"
        >
          부품명
        </label>


        <input
          id="partName"
          placeholder="부품명"
        >


        <label
          for="quantity"
        >
          수량
        </label>


        <input
          id="quantity"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          value="1"
        >


        <div
          id="lookupStatus"
          class="status"
        ></div>


        <button
          id="saveBtn"
          onclick="saveRecord()"
        >
          저장
        </button>


        <button
          class="secondary"
          onclick="resetForm()"
        >
          취소
        </button>

      </div>

    </section>



    <!-- ====================================================
         수동 입력 화면
         ==================================================== -->

    <section
      id="manualScreen"
      class="hidden"
    >

      <div class="card">

        <div class="menu-title">
          수동으로 입력
        </div>


        <label
          for="manualPartNo"
        >
          Part No
        </label>


        <input
          id="manualPartNo"
          placeholder="Part No를 입력해주세요"
          autocomplete="off"
          onkeydown="
            if(event.key==='Enter')
            lookupManualPart();
          "
        >


        <button
          id="findPartBtn"
          onclick="lookupManualPart()"
        >
          🔍 찾기
        </button>


        <div
          id="manualLookupStatus"
          class="status"
        ></div>


        <label
          for="manualPartName"
        >
          부품명
        </label>


        <input
          id="manualPartName"
          placeholder="찾기 버튼을 누르면 자동으로 표시됩니다"
          readonly
        >


        <label
          for="manualQuantity"
        >
          수량
        </label>


        <input
          id="manualQuantity"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          value="1"
        >


        <button
          id="manualSaveBtn"
          onclick="saveManualRecord()"
        >
          저장
        </button>


        <button
          class="secondary"
          onclick="resetManualForm()"
        >
          취소
        </button>


        <button
          class="secondary"
          onclick="showMenuScreen()"
        >
          ← 입력 방법 선택
        </button>

      </div>

    </section>



    <!-- ====================================================
         바코드 등록 - 비밀번호
         ==================================================== -->

    <section
      id="barcodeRegisterPasswordScreen"
      class="hidden"
    >

      <div class="card">

        <div class="menu-title">
          🔐 바코드 등록
        </div>


        <div class="sub">
          관리자 기능입니다.<br>
          등록하려면 비밀번호를 입력해주세요.
        </div>


        <label
          for="registerPassword"
        >
          비밀번호
        </label>


        <input
          id="registerPassword"
          type="password"
          inputmode="numeric"
          autocomplete="off"
          placeholder="비밀번호를 입력해주세요"
          onkeydown="
            if(event.key==='Enter')
            verifyBarcodeRegisterPassword();
          "
        >


        <div
          id="registerPasswordStatus"
          class="status"
        ></div>


        <button
          id="registerPasswordBtn"
          onclick="verifyBarcodeRegisterPassword()"
        >
          확인
        </button>


        <button
          class="secondary"
          onclick="showMenuScreen()"
        >
          ← 입력 방법 선택
        </button>

      </div>

    </section>



    <!-- ====================================================
         바코드 등록 화면
         ==================================================== -->

    <section
      id="barcodeRegisterScreen"
      class="hidden"
    >

      <div class="card">

        <div class="menu-title">
          🔐 바코드 등록
        </div>


        <div class="sub">
          바코드를 스캔한 후<br>
          해당 부품의 Part No를 입력해주세요.
        </div>


        <button
          id="registerScanBtn"
          onclick="startRegisterScan()"
        >
          📷 바코드 스캔하기
        </button>


        <div
          id="registerReader"
          class="hidden"
        ></div>


        <div
          id="registerScanGuide"
          class="scan-guide hidden"
        >
          등록할 부품의 바코드를 화면 가운데 맞춰주세요.
        </div>


        <button
          id="registerStopScanBtn"
          class="secondary hidden"
          onclick="stopRegisterScan()"
        >
          스캔 취소
        </button>


        <div
          id="registerCameraStatus"
          class="status"
        ></div>


        <!-- 등록된 바코드 -->

        <div
          id="registerBarcodeArea"
          class="hidden"
        >

          <label>
            스캔된 바코드
          </label>


          <div
            class="barcode-badge"
            id="registerBarcodeText"
          ></div>


          <label
            for="registerPartNo"
          >
            Part No
          </label>


          <input
            id="registerPartNo"
            placeholder="Part No를 입력해주세요"
            autocomplete="off"
            onkeydown="
              if(event.key==='Enter')
              registerBarcode();
            "
          >


          <button
            id="registerBarcodeBtn"
            onclick="registerBarcode()"
          >
            저장하기
          </button>


          <div
            id="registerStatus"
            class="status"
          ></div>


          <button
            class="secondary"
            onclick="resetBarcodeRegisterForm()"
          >
            다시 등록하기
          </button>

        </div>


        <button
          class="secondary"
          onclick="showMenuScreen()"
        >
          ← 입력 방법 선택
        </button>

      </div>

    </section>

  </section>

</div>



<div
  id="toast"
  class="toast"
></div>



<script>


// ============================================================
// 1. 설정
// ============================================================

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbx9LCuPz6c07KDJWNnv7xwl-VQIjj4tV_p62K6dF-SNYj5KWR-glgdfO4gP6IP32-Y6/exec';


const API_TOKEN = '';


const STORAGE_KEY =
  'inventoryEmployeeName';



let html5QrCode = null;

let registerHtml5QrCode = null;

let isScanning = false;

let isRegisterScanning = false;

let currentBarcode = '';

let currentRegisterBarcode = '';

let selectedCameraId = null;

let selectedRegisterCameraId = null;

let jsonpCounter = 0;

let registerPasswordVerified = false;



// ============================================================
// 2. 초기화
// ============================================================

window.addEventListener(
  'load',
  function() {

    const savedName =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (savedName) {

      showMain(
        savedName
      );

    } else {

      document
        .getElementById(
          'nameInput'
        )
        .focus();

    }

  }
);



// ============================================================
// 3. 로그인
// ============================================================

function login() {

  const name =
    document
      .getElementById(
        'nameInput'
      )
      .value
      .trim();


  if (!name) {

    alert(
      '이름을 입력해주세요.'
    );

    return;

  }


  localStorage.setItem(
    STORAGE_KEY,
    name
  );


  showMain(
    name
  );

}



function logout() {

  stopScan();

  stopRegisterScan();


  localStorage.removeItem(
    STORAGE_KEY
  );


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'nameInput'
    )
    .value = '';


  resetForm();

  resetManualForm();

  resetBarcodeRegisterForm();

}



function showMain(
  name
) {

  document
    .getElementById(
      'loginScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'mainScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'welcomeText'
    )
    .textContent =
    name +
    '님 안녕하세요';


  showMenuScreen();

}



// ============================================================
// 4. 화면 전환
// ============================================================

function hideAllScreens() {

  document
    .getElementById(
      'menuScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scanScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'manualScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'barcodeRegisterPasswordScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'barcodeRegisterScreen'
    )
    .classList
    .add('hidden');

}



function showMenuScreen() {

  stopScan();

  stopRegisterScan();

  hideAllScreens();


  document
    .getElementById(
      'menuScreen'
    )
    .classList
    .remove('hidden');


  resetForm();

  resetManualForm();

  resetBarcodeRegisterForm();

}



function showScanScreen() {

  stopRegisterScan();

  hideAllScreens();


  document
    .getElementById(
      'scanScreen'
    )
    .classList
    .remove('hidden');

}



function showManualScreen() {

  stopRegisterScan();

  hideAllScreens();


  document
    .getElementById(
      'manualScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'manualPartNo'
    )
    .focus();

}



// ============================================================
// 5. ★ 바코드 등록 - 비밀번호 화면
// ============================================================

function showBarcodeRegisterPassword() {

  stopScan();

  stopRegisterScan();

  hideAllScreens();


  registerPasswordVerified =
    false;


  document
    .getElementById(
      'barcodeRegisterPasswordScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'registerPassword'
    )
    .value = '';


  clearStatus(
    'registerPasswordStatus'
  );


  setTimeout(
    function() {

      document
        .getElementById(
          'registerPassword'
        )
        .focus();

    },
    100
  );

}



function verifyBarcodeRegisterPassword() {

  const password =
    document
      .getElementById(
        'registerPassword'
      )
      .value
      .trim();


  if (!password) {

    setStatus(
      'registerPasswordStatus',
      'error',
      '비밀번호를 입력해주세요.'
    );

    return;

  }


  const btn =
    document
      .getElementById(
        'registerPasswordBtn'
      );


  btn.disabled =
    true;


  btn.textContent =
    '확인 중...';


  jsonpRequest(

    {

      action:
        'registerBarcode',

      barcode:
        '__PASSWORD_CHECK__',

      partNo:
        '__PASSWORD_CHECK__',

      password:
        password

    },


    function(data) {


      btn.disabled =
        false;


      btn.textContent =
        '확인';


      // ------------------------------------------------------
      // 비밀번호 자체를 서버에서 검증
      // ------------------------------------------------------

      if (

        data &&

        data.error ===
          'invalid_password'

      ) {

        setStatus(
          'registerPasswordStatus',
          'error',
          '비밀번호가 올바르지 않습니다.'
        );

        return;

      }


      // 서버에서 password가 맞았지만
      // barcode/partNo가 임시값이므로
      // 해당 오류가 나오면 비밀번호는 맞는 것

      if (

        data &&

        (

          data.message ===
            '바코드를 스캔해주세요.' ||

          data.error ===
            undefined

        )

      ) {

        registerPasswordVerified =
          true;


        showBarcodeRegisterScreen();

        return;

      }


      // 혹시 다른 응답인 경우

      setStatus(
        'registerPasswordStatus',
        'error',
        data && data.message
          ? data.message
          : '비밀번호 확인에 실패했습니다.'
      );

    },


    function() {

      btn.disabled =
        false;


      btn.textContent =
        '확인';


      setStatus(
        'registerPasswordStatus',
        'error',
        '서버에 연결할 수 없습니다.'
      );

    }

  );

}



// ============================================================
// 6. 바코드 등록 화면
// ============================================================

function showBarcodeRegisterScreen() {

  hideAllScreens();


  document
    .getElementById(
      'barcodeRegisterScreen'
    )
    .classList
    .remove('hidden');


  resetBarcodeRegisterForm();

}



// ============================================================
// 7. 일반 카메라 시작
// ============================================================

async function startScan() {

  if (isScanning) {

    return;

  }


  clearStatus(
    'cameraStatus'
  );


  document
    .getElementById(
      'resultCard'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'reader'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'scanGuide'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'stopScanBtn'
    )
    .classList
    .remove('hidden');


  setCameraStatus(
    'info',
    '카메라를 준비하고 있습니다...'
  );


  try {

    if (

      location.protocol !== 'https:' &&

      location.hostname !== 'localhost' &&

      location.hostname !== '127.0.0.1'

    ) {

      throw new Error(
        '카메라를 사용하려면 HTTPS 주소로 접속해야 합니다.'
      );

    }


    if (

      !navigator.mediaDevices ||

      !navigator.mediaDevices.getUserMedia

    ) {

      throw new Error(
        '현재 브라우저에서 카메라 기능을 사용할 수 없습니다.'
      );

    }


    setCameraStatus(
      'info',
      '카메라 권한을 확인하고 있습니다...'
    );


    let permissionStream =
      null;


    try {

      permissionStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video: {

              facingMode: {

                ideal:
                  'environment'

              }

            },

            audio: false

          });


    } finally {

      if (
        permissionStream
      ) {

        permissionStream
          .getTracks()
          .forEach(
            function(track) {

              track.stop();

            }
          );

      }

    }


    setCameraStatus(
      'info',
      '사용 가능한 카메라를 확인하고 있습니다...'
    );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (

      !cameras ||

      cameras.length === 0

    ) {

      throw new Error(
        '사용 가능한 카메라를 찾을 수 없습니다.'
      );

    }


    const backCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ''
            ).toLowerCase();


          return (

            label.includes('back') ||

            label.includes('rear') ||

            label.includes('environment') ||

            label.includes('후면')

          );

        }
      );


    selectedCameraId =
      backCamera
        ? backCamera.id
        : cameras[0].id;


    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    isScanning = true;


    setCameraStatus(
      'info',
      '카메라를 시작하고 있습니다...'
    );


    await html5QrCode.start(

      selectedCameraId,

      {

        fps: 10,

        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const width =
              Math.floor(
                viewfinderWidth *
                0.86
              );


            const height =
              Math.floor(
                viewfinderHeight *
                0.28
              );


            return {

              width:
                Math.max(
                  220,
                  Math.min(
                    width,
                    360
                  )
                ),

              height:
                Math.max(
                  100,
                  Math.min(
                    height,
                    180
                  )
                )

            };

          },

        aspectRatio:
          1.777778,

        disableFlip:
          false

      },


      function(decodedText) {

        if (!isScanning) {

          return;

        }


        onScanSuccess(
          decodedText
        );

      },


      function(errorMessage) {

        // 정상적인 스캔 실패

      }

    );


    setCameraStatus(
      'success',
      '카메라가 실행되었습니다. 바코드를 맞춰주세요.'
    );


  } catch (err) {

    console.error(
      'CAMERA ERROR:',
      err
    );


    isScanning = false;


    cleanupScanner();


    let message =
      '카메라를 시작할 수 없습니다.';


    const errorName =
      err && err.name
        ? err.name
        : '';


    const errorText =
      String(
        err && err.message
          ? err.message
          : err
      );


    if (

      errorName ===
        'NotAllowedError' ||

      errorText.includes(
        'NotAllowedError'
      )

    ) {

      message =
        '카메라 권한이 차단되어 있습니다.\n' +
        'Chrome의 사이트 권한에서 카메라를 허용해주세요.';

    }


    else if (

      errorName ===
        'NotFoundError' ||

      errorText.includes(
        'NotFoundError'
      )

    ) {

      message =
        '사용 가능한 카메라를 찾을 수 없습니다.';

    }


    else if (

      errorName ===
        'NotReadableError' ||

      errorText.includes(
        'NotReadableError'
      )

    ) {

      message =
        '카메라가 다른 앱에서 사용 중일 수 있습니다.\n' +
        '카메라를 사용하는 앱을 종료한 후 다시 시도해주세요.';

    }


    else if (

      errorName ===
        'SecurityError'

    ) {

      message =
        '브라우저 보안 설정 때문에 카메라에 접근할 수 없습니다.';

    }


    else if (

      errorText.includes(
        'HTTPS'
      )

    ) {

      message =
        '카메라를 사용하려면 HTTPS 주소로 접속해야 합니다.';

    }


    else if (

      errorText &&

      errorText !==
        'undefined'

    ) {

      message =
        '카메라 오류: ' +
        errorText;

    }


    setCameraStatus(
      'error',
      message
    );


    showToast(
      message
    );

  }

}

async function stopScan() {

  isScanning = false;


  if (html5QrCode) {

    try {

      await html5QrCode.stop();

    } catch (err) {

      console.log(
        '카메라 stop:',
        err
      );

    }


    try {

      html5QrCode.clear();

    } catch (err) {

      console.log(
        'reader clear:',
        err
      );

    }


    html5QrCode =
      null;

  }


  cleanupScanner();

}



function cleanupScanner() {

  const reader =
    document.getElementById(
      'reader'
    );


  if (reader) {

    reader.classList
      .add('hidden');

  }


  const guide =
    document.getElementById(
      'scanGuide'
    );


  if (guide) {

    guide.classList
      .add('hidden');

  }


  const stopBtn =
    document.getElementById(
      'stopScanBtn'
    );


  if (stopBtn) {

    stopBtn.classList
      .add('hidden');

  }

}

// 9. 일반 바코드 스캔 성공

async function onScanSuccess(
  barcode
) {

  if (!isScanning) {

    return;

  }


  isScanning = false;


  currentBarcode =
    String(
      barcode || ''
    ).trim();


  await stopScan();


  document
    .getElementById(
      'barcodeText'
    )
    .textContent =
    currentBarcode;


  document
    .getElementById(
      'quantity'
    )
    .value = 1;


  document
    .getElementById(
      'partNo'
    )
    .value = '';


  document
    .getElementById(
      'partName'
    )
    .value = '';


  document
    .getElementById(
      'resultCard'
    )
    .classList
    .remove('hidden');


  setLookupStatus(
    'info',
    '부품 정보를 조회하고 있습니다...'
  );


  lookupPart(
    currentBarcode
  );

}

// 10. 바코드 조회
// ============================================================

function lookupPart(
  barcode
) {

  jsonpRequest(

    {

      action:
        'lookup',

      barcode:
        barcode,

      token:
        API_TOKEN

    },


    function(data) {


      if (

        !data ||

        data.success === false

      ) {

        setLookupStatus(
          'error',
          '부품 조회에 실패했습니다.'
        );

        return;

      }


      if (data.found) {


        document
          .getElementById(
            'partName'
          )
          .value =
          data.name || '';


        document
          .getElementById(
            'partNo'
          )
          .value =
          data.partNo || '';


        setLookupStatus(
          'success',
          '등록된 부품을 찾았습니다.'
        );


        document
          .getElementById(
            'quantity'
          )
          .focus();


      } else {


        document
          .getElementById(
            'partName'
          )
          .value = '';


        document
          .getElementById(
            'partNo'
          )
          .value = '';


        setLookupStatus(
          'error',
          '등록되지 않은 바코드입니다.'
        );

      }

    },


    function() {

      setLookupStatus(
        'error',
        '부품명 조회에 실패했습니다. 네트워크를 확인해주세요.'
      );

    }

  );

}

function saveRecord() {


  const employee =
    localStorage.getItem(
      STORAGE_KEY
    ) || '';


  const name =
    document
      .getElementById(
        'partName'
      )
      .value
      .trim();


  const partNo =
    document
      .getElementById(
        'partNo'
      )
      .value
      .trim();


  const quantity =
    Number(
      document
        .getElementById(
          'quantity'
        )
        .value
    );


  if (!employee) {

    alert(
      '로그인 정보가 없습니다. 다시 로그인해주세요.'
    );

    return;

  }


  if (!currentBarcode) {

    alert(
      '바코드가 없습니다. 다시 스캔해주세요.'
    );

    return;

  }


  if (!name) {

    alert(
      '부품명을 입력해주세요.'
    );

    return;

  }


  if (

    !Number.isInteger(
      quantity
    ) ||

    quantity <= 0

  ) {

    alert(
      '수량은 1 이상의 정수로 입력해주세요.'
    );

    return;

  }


  const saveBtn =
    document
      .getElementById(
        'saveBtn'
      );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    '저장 중...';


  jsonpRequest(

    {

      action:
        'save',

      employee:
        employee,

      barcode:
        currentBarcode,

      name:
        name,

      partNo:
        partNo,

      quantity:
        quantity,

      token:
        API_TOKEN

    },


    function(data) {


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        '저장';


      if (

        data &&

        data.success

      ) {

        showToast(
          '저장되었습니다 ✓'
        );


        resetForm();


      } else {


        const message =
          data &&
          data.message
            ? data.message
            : '저장에 실패했습니다.';


        setLookupStatus(
          'error',
          message
        );


        showToast(
          message
        );

      }

    },


    function() {


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        '저장';


      showToast(
        '저장 요청에 실패했습니다. 네트워크를 확인해주세요.'
      );

    }

  );

}

// 16. 바코드 등록 스캔 성공
// ============================================================

async function onRegisterScanSuccess(
  barcode
) {

  if (!isRegisterScanning) {

    return;

  }


  isRegisterScanning =
    false;


  currentRegisterBarcode =
    String(
      barcode || ''
    ).trim();


  await stopRegisterScan();


  document
    .getElementById(
      'registerBarcodeText'
    )
    .textContent =
    currentRegisterBarcode;


  document
    .getElementById(
      'registerPartNo'
    )
    .value = '';


  document
    .getElementById(
      'registerBarcodeArea'
    )
    .classList
    .remove('hidden');


  clearStatus(
    'registerStatus'
  );


  document
    .getElementById(
      'registerPartNo'
    )
    .focus();

}



// ============================================================
// 17. ★ 바코드 등록 저장
// ============================================================

function registerBarcode() {


  if (
    !registerPasswordVerified
  ) {

    alert(
      '먼저 관리자 인증을 해주세요.'
    );

    showBarcodeRegisterPassword();

    return;

  }


  const partNo =
    document
      .getElementById(
        'registerPartNo'
      )
      .value
      .trim();


  if (!currentRegisterBarcode) {

    setStatus(
      'registerStatus',
      'error',
      '먼저 바코드를 스캔해주세요.'
    );

    return;

  }


  if (!partNo) {

    setStatus(
      'registerStatus',
      'error',
      'Part No를 입력해주세요.'
    );

    return;

  }


  const btn =
    document
      .getElementById(
        'registerBarcodeBtn'
      );


  btn.disabled =
    true;


  btn.textContent =
    '등록 중...';


  setStatus(
    'registerStatus',
    'info',
    '부품마스터에서 Part No를 찾고 있습니다...'
  );


  // ----------------------------------------------------------
  // 비밀번호는 브라우저에 저장하지 않고
  // 서버에 다시 전달
  //
  // 보안을 위해 비밀번호는 실제 저장되지 않음
  // ----------------------------------------------------------

  const password =
    document
      .getElementById(
        'registerPassword'
      )
      .value
      .trim();


  jsonpRequest(

    {

      action:
        'registerBarcode',

      barcode:
        currentRegisterBarcode,

      partNo:
        partNo,

      password:
        password

    },


    function(data) {


      btn.disabled =
        false;


      btn.textContent =
        '저장하기';


      if (

        data &&

        data.success

      ) {


        setStatus(

          'registerStatus',

          'success',

          '바코드 등록이 완료되었습니다.\n\n' +

          '부품명: ' +
          (data.name || '-') +

          '\nPart No: ' +
          (data.partNo || '-') +

          '\n바코드: ' +
          (data.barcode || '-')

        );


        showToast(
          '바코드가 등록되었습니다 ✓'
        );


        // 등록 완료 후
        // 새로 등록할 수 있도록
        // Part No만 비움

        setTimeout(
          function() {

            document
              .getElementById(
                'registerPartNo'
              )
              .value = '';

          },
          300
        );


      } else {


        const message =
          data &&
          data.message
            ? data.message
            : '바코드 등록에 실패했습니다.';


        let extra =
          '';


        if (
          data &&
          data.error ===
            'existing_barcode'
        ) {

          extra =
            '\n\n기존 바코드: ' +
            (data.existingBarcode || '');

        }


        if (
          data &&
          data.error ===
            'duplicate_barcode'
        ) {

          extra =
            '\n\n이미 등록된 Part No: ' +
            (data.existingPartNo || '') +

            '\n부품명: ' +
            (data.existingName || '');

        }


        setStatus(
          'registerStatus',
          'error',
          message +
          extra
        );


        showToast(
          message
        );

      }

    },


    function() {


      btn.disabled =
        false;


      btn.textContent =
        '저장하기';


      setStatus(
        'registerStatus',
        'error',
        '등록 요청에 실패했습니다. 네트워크를 확인해주세요.'
      );

    }

  );

}

// ============================================================
// 19. JSONP
// ============================================================

function jsonpRequest(
  params,
  onSuccess,
  onError
) {


  const callbackName =
    '__inventory_jsonp_' +
    Date.now() +
    '_' +
    (++jsonpCounter);


  const script =
    document.createElement(
      'script'
    );


  let finished =
    false;


  const timeout =
    setTimeout(
      function() {

        finish();


        if (onError) {

          onError(
            new Error(
              'API timeout'
            )
          );

        }

      },
      15000
    );


  window[callbackName] =
    function(data) {

      finish();


      if (onSuccess) {

        onSuccess(
          data
        );

      }

    };


  const query =
    new URLSearchParams();


  Object.keys(params)
    .forEach(
      function(key) {


        const value =
          params[key];


        if (

          value !== undefined &&

          value !== null

        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  query.set(
    'callback',
    callbackName
  );


  query.set(
    '_',
    String(
      Date.now()
    )
  );


  script.src =
    APPS_SCRIPT_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {


      finish();


      if (onError) {

        onError(
          new Error(
            'API request failed'
          )
        );

      }

    };


  document
    .body
    .appendChild(
      script
    );



  function finish() {


    if (finished) {

      return;

    }


    finished =
      true;


    clearTimeout(
      timeout
    );


    try {

      delete window[
        callbackName
      ];

    } catch (e) {

      window[
        callbackName
      ] =
        undefined;

    }


    if (
      script.parentNode
    ) {

      script
        .parentNode
        .removeChild(
          script
        );

    }

  }

}

// ============================================================
// 22. 상태 표시
// ============================================================

function setStatus(
  id,
  type,
  message
) {

  const el =
    document
      .getElementById(
        id
      );


  el.className =
    'status ' +
    type;


  el.textContent =
    message;

}



function setCameraStatus(
  type,
  message
) {

  setStatus(
    'cameraStatus',
    type,
    message
  );

}



function setLookupStatus(
  type,
  message
) {

  setStatus(
    'lookupStatus',
    type,
    message
  );

}



function setManualLookupStatus(
  type,
  message
) {

  setStatus(
    'manualLookupStatus',
    type,
    message
  );

}



function clearStatus(
  id
) {


  const el =
    document
      .getElementById(
        id
      );


  if (!el) {

    return;

  }


  el.className =
    'status';


  el.textContent =
    '';

}



// ============================================================
// 23. Toast
// ============================================================

function showToast(
  message
) {


  const el =
    document
      .getElementById(
        'toast'
      );


  el.textContent =
    message;


  el.classList
    .add('show');


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      function() {


        el.classList
          .remove('show');


      },
      2600
    );

}
